name: Run Tests

on: ["push","pull_request"]

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: ["ubuntu-latest"]
        php: ["8.3"]

    name: PHP ${{ matrix.php }} - ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json, zip, dom, curl, libxml, mbstring, sodium, pdo_sqlite, pdo_mysql
          tools: composer:v2
          coverage: ${{ (matrix.os == 'ubuntu-latest' && matrix.php == '8.3') && 'xdebug' || 'none' }}

      - name: Install PHP dependencies
        run: composer update --no-interaction --no-progress

      - name: Run Tests
        run: composer run test${{ (matrix.os == 'ubuntu-latest' && matrix.php == '8.3') && ' -- --flags=coverage' || '' }}
