# Tracked accounts (AccountService): logins that exist on servers or in a
# directory, with their current password and rotation schedule.
# type: "local" (belongs to server_id), "ldap" or "shared".
# service: what a local account is on its server: "ssh" (a system user) or "mysql" (a database user).
#   LDAP and shared accounts can be used for either; their service is null.
# password: encrypted with SecretCipher ("account-password:<id>"); revealed to
#   admins only, and every reveal is logged in password_reveals.
# password_changed_at: when the password was last reset (as recorded here).
# rotation_days: change every N days; null = no rotation. Due = changed + N.
# origin: where the account came from: "manual" (added by an admin: origin_user_id), "server" (created from a
#   server's SSH or database login: origin_server_id) or "import" (imported from a MariaDB server's users:
#   origin_server_id, origin_user_id who imported it, origin_detail the MariaDB account). Null for accounts from
#   before origins were recorded. Imported accounts have no password until an admin records one, and can't be used
#   to log in until then (Account::canLogIn()).
columns:
  username: string
  type: string
  server_id:
    type: integer
    nullable: true
    index: true
  service:
    type: string
    nullable: true
    default: ssh
  password:
    type: text
    nullable: true
  password_changed_at:
    type: timestamp
    nullable: true
  rotation_days:
    type: integer
    nullable: true
  notes:
    type: text
    nullable: true
  origin:
    type: string
    nullable: true
  origin_server_id:
    type: integer
    nullable: true
  origin_user_id:
    type: integer
    nullable: true
  origin_detail:
    type: text
    nullable: true
