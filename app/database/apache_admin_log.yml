# Changes made to Apache through the app: this machine's through sys-apache-helper (LocalApacheService,
# server_id null), a monitored server's through the SSH user's sudo rules (RemoteApacheService, server_id set).
# action: e.g. "write", "enable", "reload"; target: e.g. "site 002-sys"; output: what Apache and the tools said.
# previous: a remote file's text before the change (the backup; this machine's helper keeps its own).
timestamps: false
columns:
  user_id:
    type: integer
    index: true
  server_id:
    type: integer
    nullable: true
    index: true
  action: string
  target:
    type: string
    nullable: true
  ok: boolean
  output:
    type: mediumText
    nullable: true
  previous:
    type: mediumText
    nullable: true
  created_at:
    type: timestamp
    index: true
