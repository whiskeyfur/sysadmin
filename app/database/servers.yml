# Servers the app monitors (ServerService).
# ssh_host_key: the server's trusted SSH host key ("type base64"); null until
#   an admin trusts it. Cleared when hostname or ssh_port changes.
# ssh_auth: "key" (the app's key) or "password" (fallback for servers that refuse key login).
# ssh_password: only for ssh_auth "password"; encrypted with SecretCipher, write-only.
# ssh_password_allowed: opt-in; when false (default) the app never attempts a password login
#   on this server (e.g. fail2ban bans on the first attempt).
# mysql_password: encrypted with SecretCipher; write-only in the UI.
# mysql_tls: "off", "encrypt" (no certificate check) or "verify" (CA + hostname).
# mysql_tls_ca: optional CA certificate(s) in PEM for "verify"; null = system CAs.
columns:
  name:
    type: string
    unique: true
  hostname: string
  ssh_port:
    type: integer
    default: 22
  ssh_username: string
  ssh_host_key:
    type: text
    nullable: true
  ssh_auth:
    type: string
    default: 'key'
  ssh_password:
    type: text
    nullable: true
  ssh_password_allowed:
    type: boolean
    default: false
  mysql_enabled:
    type: boolean
    default: false
  mysql_host:
    type: string
    nullable: true
  mysql_port:
    type: integer
    default: 3306
  mysql_username:
    type: string
    nullable: true
  mysql_password:
    type: text
    nullable: true
  mysql_tls:
    type: string
    default: 'off'
  mysql_tls_ca:
    type: text
    nullable: true
  last_tested_at:
    type: timestamp
    nullable: true
  last_test_ok:
    type: boolean
    nullable: true
  last_test_message:
    type: text
    nullable: true
  # Health checks (HealthCheckService). The interval is for a future scheduler.
  check_interval_minutes:
    type: integer
    default: 5
  last_checked_at:
    type: timestamp
    nullable: true
  last_health_status:
    type: string
    nullable: true
