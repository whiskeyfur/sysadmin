# Servers the app monitors (ServerService). Each has one or more of SSH,
# MariaDB/MySQL and SSL monitoring.
# ssh_enabled: SSH checks on; ssh_username is '' when off.
# ssh_host_key: the server's trusted SSH host key ("type base64"); null until
#   an admin trusts it. Cleared when hostname or ssh_port changes.
# ssh_auth: "key" (the app's key) or "password" (fallback for servers that refuse key login).
# ssh_password: only for ssh_auth "password"; encrypted with SecretCipher, write-only.
# ssh_password_allowed: opt-in; when false (default) the app never attempts a password login
#   on this server (e.g. fail2ban bans on the first attempt).
# ssh_account_id / mysql_account_id: the tracked account (accounts table) used to log in; ssh_username and
#   mysql_username are kept in step with it. Passwords live on the account.
# ssh_password / mysql_password: legacy, from before accounts; moved into the account by
#   AccountService::syncServers() and then cleared.
# mysql_tls: "off", "encrypt" (no certificate check) or "verify" (CA + hostname).
# mysql_tls_ca: optional CA certificate(s) in PEM for "verify"; null = system CAs.
columns:
  name:
    type: string
    unique: true
  hostname: string
  ssh_enabled:
    type: boolean
    default: true
  ssh_port:
    type: integer
    default: 22
  # The account used for SSH (AccountService); ssh_username mirrors its username.
  ssh_account_id:
    type: integer
    nullable: true
  ssh_username: string
  ssh_host_key:
    type: text
    nullable: true
  ssh_auth:
    type: string
    default: 'key'
  # "windows" or "unix", read from the SSH banner (ServerPlatform); null until seen.
  ssh_platform:
    type: string
    nullable: true
  ssh_password:
    type: text
    nullable: true
  ssh_password_allowed:
    type: boolean
    default: false
  mysql_enabled:
    type: boolean
    default: false
  mysql_host:
    type: string
    nullable: true
  mysql_port:
    type: integer
    default: 3306
  mysql_account_id:
    type: integer
    nullable: true
  mysql_username:
    type: string
    nullable: true
  mysql_password:
    type: text
    nullable: true
  mysql_tls:
    type: string
    default: 'off'
  mysql_tls_ca:
    type: text
    nullable: true
  last_tested_at:
    type: timestamp
    nullable: true
  last_test_ok:
    type: boolean
    nullable: true
  last_test_message:
    type: text
    nullable: true
  # Legacy SSL settings, converted to ssl_certificates/ssl_bindings by
  # SslMonitorService::convertLegacy(). last_ssl_* hold the worst binding result.
  ssl_enabled:
    type: boolean
    default: false
  ssl_hosts:
    type: text
    nullable: true
  last_ssl_checked_at:
    type: timestamp
    nullable: true
  last_ssl_status:
    type: string
    nullable: true
  # Apache monitoring over SSH, from its own configuration and log files (ApacheService); needs SSH set up.
  # apache_config: JSON of what the last configuration scan found (control program, ServerRoot, log files,
  #   mod_status location if any) and apache_scanned_at when; rescanned hourly.
  # apache_import_state: JSON, per log file, how far the last read got (inode and byte offset).
  apache_enabled:
    type: boolean
    default: false
  apache_config:
    type: text
    nullable: true
  apache_scanned_at:
    type: timestamp
    nullable: true
  apache_import_state:
    type: text
    nullable: true
  # apache_config_file: Apache's main configuration file (e.g. /etc/httpd/conf/httpd.conf), read directly
  #   when its control program isn't in the SSH user's PATH; null to rely on the control program.
  apache_config_file:
    type: string
    nullable: true
  # apache_container: the Docker/Podman container Apache was found in ("podman:web"), tried first next scan.
  apache_container:
    type: string
    nullable: true
  # Health checks (HealthCheckService). The interval is for a future scheduler.
  check_interval_minutes:
    type: integer
    default: 5
  last_checked_at:
    type: timestamp
    nullable: true
  log_imported_at:
    type: timestamp
    nullable: true
  # JSON: per log file, how far the last import read (inode and byte offset), so scheduled imports read only new lines.
  log_import_state:
    type: text
    nullable: true
  # The last import's outcome, e.g. "12 new entries" or a permission problem (imports also run on a schedule).
  log_import_message:
    type: text
    nullable: true
  last_health_status:
    type: string
    nullable: true
