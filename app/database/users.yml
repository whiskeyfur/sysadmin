# role: "admin" or "user".
# totp_secret: authenticator secret, encrypted with a key derived from APP_KEY (SecretCipher).
# totp_last_step: last accepted TOTP time step, so a code can't be reused.
# must_change_password: set for new accounts and admin resets; forces first-login setup.
# password_changed_at: passwords expire PasswordService::MAX_AGE_DAYS after this.
# session_version: bumped to sign the user out everywhere.
columns:
  username:
    type: string
    unique: true
  password: string
  role: string
  totp_secret:
    type: text
    nullable: true
  totp_last_step:
    type: integer
    nullable: true
  must_change_password:
    type: boolean
    default: true
  password_changed_at:
    type: timestamp
    nullable: true
  session_version:
    type: integer
    default: 0
