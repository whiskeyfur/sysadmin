# role: "admin" or "user".
# totp_secret: authenticator secret, encrypted with a key derived from APP_KEY (SecretCipher).
# totp_last_step: last accepted TOTP time step, so a code can't be reused.
# password: Argon2id hash of the admin-set one-time password; null once used (setup done).
# login_password: Argon2id hash of the password the user chose (the "password" sign-in method); null if none.
# must_change_password: set for new accounts and admin resets (one-time password pending setup).
# Passkeys and security keys are in the passkeys table. Which methods are on, and required, are settings.
# session_version: bumped to sign the user out everywhere.
columns:
  username:
    type: string
    unique: true
  password:
    type: string
    nullable: true
  role: string
  totp_secret:
    type: text
    nullable: true
  totp_last_step:
    type: integer
    nullable: true
  login_password:
    type: string
    nullable: true
  password_changed_at:
    type: timestamp
    nullable: true
  must_change_password:
    type: boolean
    default: true
  session_version:
    type: integer
    default: 0
