# role: "admin" or "user".
# totp_secret: authenticator secret, encrypted with a key derived from APP_KEY (SecretCipher).
# totp_last_step: last accepted TOTP time step, so a code can't be reused.
# password: Argon2id hash of the admin-set one-time password; null once used. Users have no passwords:
#   they sign in with their username and an authenticator code.
# must_change_password: set for new accounts and admin resets (one-time password pending setup).
# session_version: bumped to sign the user out everywhere.
columns:
  username:
    type: string
    unique: true
  password:
    type: string
    nullable: true
  role: string
  totp_secret:
    type: text
    nullable: true
  totp_last_step:
    type: integer
    nullable: true
  must_change_password:
    type: boolean
    default: true
  session_version:
    type: integer
    default: 0
