# Fail2Ban filter: every client error response (400, 401, 403, 404, 405, 444) in Apache access logs
# (common, combined and vhost_combined formats). The jail's maxretry/findtime turn this into "a flood
# of errors": a scanner walking a word list, or a bot hammering a login.
# Part of sys (extras/fail2ban); see README.md there.
#
# 408 (a browser's idle preconnect timing out) and 429 (already rate limited) aren't counted.

[Definition]

_prefix = ^(?:\S+:\d+ )?<HOST> \S+ \S+ (?:\[[^\]]*\] )?

failregex = %(_prefix)s"[^"]*" (?:400|401|403|404|405|444)\s

ignoreregex =

