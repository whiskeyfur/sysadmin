# Fail2Ban filter: web abusers in Apache access logs (common, combined and vhost_combined formats).
# Part of sys (extras/fail2ban); see README.md there.
#
# Matches requests that only scanners and exploit kits send, when the server answered them with a
# 4xx (so a site that really has, say, /wp-login.php isn't affected), plus malformed requests:
# TLS or binary junk sent to a plain-HTTP port, and proxy attempts (CONNECT, absolute URLs).

[Definition]

# Paths and strings vulnerability scanners probe for (checked against real scans; kept specific, since
# a ban is permanent: e.g. no bare /vendor/, which browsers' devtools request for source maps). Remove any your sites legitimately serve with
# a 4xx (e.g. wp-login\.php on a WordPress site that answers 403 to strangers).
probe = wp-login\.php|xmlrpc\.php|wp-(?:admin|content|includes)/|wlwmanifest\.xml|/\.env|/\.git/|/\.svn/|/\.hg/|/\.aws/|/\.ssh/|/\.DS_Store|/\.htpasswd|/\.vscode/|/\.idea/|phpmyadmin|/pma/|myadmin|/adminer|/phpunit|eval-stdin\.php|/cgi-bin/|/boaform|/HNAP1|/actuator/|/solr/|/owa/|/autodiscover/|/manager/html|/cmd\.php|/setup\.php|/install\.php|/config\.php|/server-status|\$\{jndi:|%%24%%7Bjndi|\.\./\.\./|%%2e%%2e%%2f|\.%%2e/|/etc/passwd|<script|union(?:\+|%%20|\s)+select

# Optional vhost:port, client, identity, user, [time] (fail2ban may already have cut the time out).
_prefix = ^(?:\S+:\d+ )?<HOST> \S+ \S+ (?:\[[^\]]*\] )?

failregex = %(_prefix)s"[A-Z]+ [^"]*?(?i:%(probe)s)[^"]*" 4\d\d\s
            %(_prefix)s"(?:-|[^"]*\\x[0-9a-fA-F]{2}[^"]*)" 400\s
            %(_prefix)s"(?:CONNECT [^"]*|[A-Z]+ https?://[^"]*)" 4\d\d\s

ignoreregex =

